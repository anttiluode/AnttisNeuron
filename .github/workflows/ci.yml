name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit and invariant tests
        run: pytest -q
      - name: Scientific gate smoke run
        run: |
          python experiments/gate0_oja.py --out /tmp/gate0.json
          python experiments/gate1_identities.py --out /tmp/gate1.json
          python experiments/gate2_mode_energy.py --out /tmp/gate2.json
          python experiments/gate3_temporal_modes.py --out /tmp/gate3.json
          python experiments/gate4_alignment.py --out /tmp/gate4.json
          python experiments/gate5_adaptive_cable.py --out /tmp/gate5.json
          python experiments/gate5b_spectral_audit.py --out /tmp/gate5b.json
          python experiments/gate7_load_compensation.py --worlds 2 --out /tmp/gate7-smoke.json
      - name: Gate 6 many-world verification
        if: matrix.python-version == '3.11'
        run: python experiments/gate6_many_worlds.py --worlds 24 --out /tmp/gate6.json
      - name: Gate 7 frozen-receipt verification
        if: matrix.python-version == '3.11'
        run: |
          python experiments/gate7_load_compensation.py --seed 17 --worlds 24 --out /tmp/gate7.json
          sha256sum results/gate7.json /tmp/gate7.json
          diff -u results/gate7.json /tmp/gate7.json || true
          cmp /tmp/gate7.json results/gate7.json
