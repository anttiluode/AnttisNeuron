name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit and invariant tests
        run: pytest -q
      - name: Scientific gate smoke run
        run: |
          python experiments/gate0_oja.py --out /tmp/gate0.json
          python experiments/gate1_identities.py --out /tmp/gate1.json
          python experiments/gate2_mode_energy.py --out /tmp/gate2.json
          python experiments/gate3_temporal_modes.py --out /tmp/gate3.json
          python experiments/gate4_alignment.py --out /tmp/gate4.json
          python experiments/gate5_adaptive_cable.py --out /tmp/gate5.json
          python experiments/gate5b_spectral_audit.py --out /tmp/gate5b.json
      - name: Gate 6 many-world verification
        if: matrix.python-version == '3.11'
        run: python experiments/gate6_many_worlds.py --worlds 24 --out /tmp/gate6.json
      - name: Freeze corrected Gate 6 receipt
        if: matrix.python-version == '3.11' && github.event_name == 'push' && github.ref == 'refs/heads/study/gate5b-gate6-worlds'
        run: |
          cp /tmp/gate6.json results/gate6.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/gate6.json
          if ! git diff --cached --quiet; then
            git commit -m "exp: freeze corrected Gate 6 subspace receipt"
            git push
          fi
